<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusinessBuild Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.2); border-radius: 10px; }
  input, textarea, select { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  button { cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script src="app-storage.js"></script>
<script src="app-data.js"></script>
<script type="text/babel" src="app-sidebar.jsx"></script>
<script type="text/babel" src="app-views.jsx"></script>
<script type="text/babel" src="app-drawer.jsx"></script>

<script type="text/babel">

const NOIR = {
  // Layout
  bg: '#000',
  sidebar: '#0b0c10',
  sidebarBorder: 'rgba(255,255,255,0.05)',
  sidebarText: '#fff',
  sidebarMuted: '#5a6068',
  sidebarActive: 'rgba(255,255,255,0.06)',
  surface: '#0d0f15',
  border: 'rgba(255,255,255,0.05)',
  // Text
  text: '#fff',
  mutedText: '#5a6068',
  // Accent
  accent: '#00e5d4',
  accentMuted: 'rgba(0,229,212,0.12)',
  accentBorder: 'rgba(0,229,212,0.35)',
  // Misc surfaces
  pillBg: 'rgba(255,255,255,0.06)',
  progressBg: 'rgba(255,255,255,0.06)',
  columnBg: '#0d0f15',
  cardShadow: '0 1px 4px rgba(0,0,0,0.5)',
  cardShadowHover: '0 4px 20px rgba(0,0,0,0.6)',
  hoverBg: 'rgba(255,255,255,0.03)',
};

// ── Helpers ───────────────────────────────────────────────────────────────────
function calcProgress(tasks) {
  if (!tasks || tasks.length === 0) return 0;
  return Math.round(tasks.filter(t => t.status === 'done').length / tasks.length * 100);
}

function updateTaskInWs(workspaces, wsId, projId, updatedTask) {
  return workspaces.map(ws => {
    if (ws.id !== wsId) return ws;
    return {
      ...ws,
      areas: ws.areas.map(area => ({
        ...area,
        projects: area.projects.map(proj => {
          if (proj.id !== projId) return proj;
          const tasks = proj.tasks.map(t => t.id === updatedTask.id ? updatedTask : t);
          return { ...proj, tasks, progress: calcProgress(tasks) };
        }),
      })),
    };
  });
}

function moveTaskInWs(workspaces, wsId, projId, taskId, newStatus) {
  return workspaces.map(ws => {
    if (ws.id !== wsId) return ws;
    return {
      ...ws,
      areas: ws.areas.map(area => ({
        ...area,
        projects: area.projects.map(proj => {
          if (proj.id !== projId) return proj;
          const tasks = proj.tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t);
          return { ...proj, tasks, progress: calcProgress(tasks) };
        }),
      })),
    };
  });
}

function addTaskInWs(workspaces, wsId, projId, task) {
  return workspaces.map(ws => {
    if (ws.id !== wsId) return ws;
    return {
      ...ws,
      areas: ws.areas.map(area => ({
        ...area,
        projects: area.projects.map(proj => {
          if (proj.id !== projId) return proj;
          const tasks = [...proj.tasks, task];
          return { ...proj, tasks, progress: calcProgress(tasks), status: 'active' };
        }),
      })),
    };
  });
}

function deleteTaskInWs(workspaces, wsId, projId, taskId) {
  return workspaces.map(ws => {
    if (ws.id !== wsId) return ws;
    return {
      ...ws,
      areas: ws.areas.map(area => ({
        ...area,
        projects: area.projects.map(proj => {
          if (proj.id !== projId) return proj;
          const tasks = proj.tasks.filter(t => t.id !== taskId);
          return { ...proj, tasks, progress: calcProgress(tasks) };
        }),
      })),
    };
  });
}

function addProjectInWs(workspaces, wsId, areaId, project) {
  return workspaces.map(ws => {
    if (ws.id !== wsId) return ws;
    return {
      ...ws,
      areas: ws.areas.map(area => {
        if (area.id !== areaId) return area;
        return { ...area, projects: [...area.projects, project] };
      }),
    };
  });
}

// Workspace helpers
function addWorkspaceInWs(workspaces, workspace) {
  return [...workspaces, workspace];
}
function updateWorkspaceInWs(workspaces, wsId, updates) {
  return workspaces.map(function(ws) { return ws.id === wsId ? Object.assign({}, ws, updates) : ws; });
}
function deleteWorkspaceInWs(workspaces, wsId) {
  return workspaces.filter(function(ws) { return ws.id !== wsId; });
}

// Area helpers
function addAreaInWs(workspaces, wsId, area) {
  return workspaces.map(function(ws) {
    if (ws.id !== wsId) return ws;
    return Object.assign({}, ws, { areas: [...ws.areas, area] });
  });
}
function updateAreaInWs(workspaces, wsId, areaId, updates) {
  return workspaces.map(function(ws) {
    if (ws.id !== wsId) return ws;
    return Object.assign({}, ws, { areas: ws.areas.map(function(a) { return a.id === areaId ? Object.assign({}, a, updates) : a; }) });
  });
}
function deleteAreaInWs(workspaces, wsId, areaId) {
  return workspaces.map(function(ws) {
    if (ws.id !== wsId) return ws;
    return Object.assign({}, ws, { areas: ws.areas.filter(function(a) { return a.id !== areaId; }) });
  });
}

// Project helpers
function updateProjectInWs(workspaces, wsId, projId, updates) {
  return workspaces.map(function(ws) {
    if (ws.id !== wsId) return ws;
    return Object.assign({}, ws, { areas: ws.areas.map(function(area) {
      return Object.assign({}, area, { projects: area.projects.map(function(proj) {
        return proj.id === projId ? Object.assign({}, proj, updates) : proj;
      })});
    })});
  });
}
function deleteProjectInWs(workspaces, wsId, projId) {
  return workspaces.map(function(ws) {
    if (ws.id !== wsId) return ws;
    return Object.assign({}, ws, { areas: ws.areas.map(function(area) {
      return Object.assign({}, area, { projects: area.projects.filter(function(proj) { return proj.id !== projId; }) });
    })});
  });
}

// Reorder tasks within a column (insert taskId before targetTaskId)
function reorderTaskInWs(workspaces, wsId, projId, taskId, targetTaskId) {
  return workspaces.map(function(ws) {
    if (ws.id !== wsId) return ws;
    return Object.assign({}, ws, { areas: ws.areas.map(function(area) {
      return Object.assign({}, area, { projects: area.projects.map(function(proj) {
        if (proj.id !== projId) return proj;
        var tasks = proj.tasks || [];
        var moving = tasks.find(function(t) { return t.id === taskId; });
        if (!moving) return proj;
        var without = tasks.filter(function(t) { return t.id !== taskId; });
        var targetIdx = without.findIndex(function(t) { return t.id === targetTaskId; });
        var insertAt = targetIdx >= 0 ? targetIdx : without.length;
        var newTasks = without.slice(0, insertAt).concat([moving], without.slice(insertAt));
        return Object.assign({}, proj, { tasks: newTasks });
      })});
    })});
  });
}

// ── NavTabs component (isolated so active prop reliably triggers re-render) ──
function NavTabs({ activeView, onSetView, theme }) {
  const views = ['dashboard', 'kanban', 'calendar', 'roadmap'];
  const labels = { dashboard: 'Dashboard', kanban: 'Board', calendar: 'Calendar', roadmap: 'Roadmap' };
  return (
    <div style={{ display: 'flex', gap: 4 }}>
      {views.map(v => {
        const on = activeView === v;
        return (
          <button
            key={v}
            onClick={() => onSetView(v)}
            style={{
              padding: '5px 13px',
              borderRadius: 7,
              border: `1px solid ${on ? theme.accentBorder : theme.border}`,
              background: on ? theme.accentMuted : 'transparent',
              color: on ? theme.accent : theme.mutedText,
              fontSize: 12,
              fontWeight: on ? 600 : 500,
              fontFamily: 'inherit',
              transition: 'all 0.12s',
            }}
          >{labels[v]}</button>
        );
      })}
    </div>
  );
}
function App() {
  const theme = NOIR;

  const [workspaces, setWorkspaces] = React.useState(() => BBStorage.load());
  const [showArchived, setShowArchived] = React.useState(false);
  const [wsId, setWsId] = React.useState('ws_default');
  const [activeView, setActiveView] = React.useState('dashboard');
  const [selectedProject, setSelectedProject] = React.useState(null);
  const [searchOpen, setSearchOpen] = React.useState(false);

  // Drawer state
  const [drawerTask, setDrawerTask] = React.useState(null);
  const [drawerProject, setDrawerProject] = React.useState(null);
  const [drawerArea, setDrawerArea] = React.useState(null);
  const [drawerWsId, setDrawerWsId] = React.useState(null);

  // New project modal
  const [showNewProject, setShowNewProject] = React.useState(false);
  const [editingProject, setEditingProject] = React.useState(null);

  const searchBtnRef = React.useRef(null);

  // Toast state
  const [toast, setToast] = React.useState(null);
  const toastTimerRef = React.useRef(null);
  const showToast = (msg) => {
    clearTimeout(toastTimerRef.current);
    setToast(msg);
    toastTimerRef.current = setTimeout(() => setToast(null), 3000);
  };
  const handleExport = () => BBStorage.exportJSON(workspaces);
  const handleImport = () => BBStorage.importJSON(
    function(imported) { setWorkspaces(imported); setWsId(imported[0].id); showToast('Data imported — ' + imported.length + ' workspace(s) loaded'); },
    function(err) { showToast('Import failed: ' + err); }
  );

  React.useEffect(function() { BBStorage.save(workspaces); }, [workspaces]);

  React.useEffect(function() {
    if (workspaces.length > 0 && !workspaces.find(function(w) { return w.id === wsId; })) {
      setWsId(workspaces[0].id);
    }
  }, [workspaces, wsId]);

  const workspace = workspaces.find(w => w.id === wsId) || workspaces[0];

  const visibleWorkspace = React.useMemo(function() {
    if (showArchived) return workspace;
    return Object.assign({}, workspace, {
      areas: workspace.areas.map(function(area) {
        return Object.assign({}, area, {
          projects: area.projects.filter(function(p) { return p.status !== 'archived'; }),
        });
      }),
    });
  }, [workspace, showArchived]);

  const overdueMap = React.useMemo(function() {
    var today = new Date().toISOString().slice(0, 10);
    var map = {};
    workspaces.forEach(function(ws) {
      (ws.areas || []).forEach(function(area) {
        (area.projects || []).forEach(function(proj) {
          var count = (proj.tasks || []).filter(function(t) {
            return t.due && t.due < today && t.status !== 'done';
          }).length;
          if (count > 0) map[proj.id] = count;
        });
      });
    });
    return map;
  }, [workspaces]);

  const findProjectArea = (projId) => {
    for (const ws of workspaces) {
      for (const area of ws.areas) {
        const proj = area.projects.find(p => p.id === projId);
        if (proj) return { area, ws };
      }
    }
    return {};
  };

  const handleOpenTask = (task, project) => {
    const { area } = findProjectArea(project?.id);
    setDrawerTask(task);
    setDrawerProject(project);
    setDrawerArea(area);
    setDrawerWsId(wsId);
  };

  const handleSearchOpenTask = function(task, proj, ws) {
    // Look up area in the target workspace (not current active workspace)
    var foundArea = null;
    (ws.areas || []).forEach(function(area) {
      if ((area.projects || []).find(function(p) { return p.id === proj.id; })) {
        foundArea = area;
      }
    });
    setDrawerTask(task);
    setDrawerProject(proj);
    setDrawerArea(foundArea);
    setDrawerWsId(ws.id);
  };

  const handleUpdateTask = (updatedTask) => {
    if (!drawerProject) return;
    setWorkspaces(prev => updateTaskInWs(prev, drawerWsId || wsId, drawerProject.id, updatedTask));
    setDrawerTask(updatedTask);
  };

  const handleDeleteTask = (taskId) => {
    if (!drawerProject) return;
    setWorkspaces(prev => deleteTaskInWs(prev, drawerWsId || wsId, drawerProject.id, taskId));
  };

  const handleMoveTask = (projId, taskId, newStatus) => {
    setWorkspaces(prev => moveTaskInWs(prev, wsId, projId, taskId, newStatus));
  };

  const handleAddTask = (projId, task) => {
    setWorkspaces(prev => addTaskInWs(prev, wsId, projId, task));
  };

  const handleAddProject = (project) => {
    setWorkspaces(prev => addProjectInWs(prev, wsId, project.areaId, project));
  };

  const handleAddWorkspace = (ws) => setWorkspaces(prev => addWorkspaceInWs(prev, ws));
  const handleRenameWorkspace = (targetWsId, updates) => setWorkspaces(prev => updateWorkspaceInWs(prev, targetWsId, updates));
  const handleDeleteWorkspace = (targetWsId) => {
    const remaining = workspaces.filter(function(w) { return w.id !== targetWsId; });
    if (remaining.length === 0) return;
    const nextId = wsId === targetWsId ? remaining[0].id : wsId;
    setWorkspaces(deleteWorkspaceInWs(workspaces, targetWsId));
    setWsId(nextId);
    setSelectedProject(null);
    setDrawerTask(null);
    setDrawerWsId(null);
  };
  const handleResetData = () => {
    BBStorage.clear();
    const fresh = BBStorage.load();
    setWorkspaces(fresh);
    setWsId(fresh[0].id);
    setSelectedProject(null);
    setDrawerTask(null);
    setDrawerWsId(null);
  };
  const handleAddArea = (targetWsId, area) => setWorkspaces(prev => addAreaInWs(prev, targetWsId, area));
  const handleRenameArea = (targetWsId, areaId, name) => setWorkspaces(prev => updateAreaInWs(prev, targetWsId, areaId, { name }));
  const handleDeleteArea = (targetWsId, areaId) => setWorkspaces(prev => deleteAreaInWs(prev, targetWsId, areaId));
  const handleUpdateProject = (projId, updates) => setWorkspaces(prev => updateProjectInWs(prev, wsId, projId, updates));
  const handleDeleteProject = (projId) => {
    setWorkspaces(prev => deleteProjectInWs(prev, wsId, projId));
    if (selectedProject === projId) setSelectedProject(null);
  };
  const handleReorderTask = (projId, taskId, targetTaskId) => {
    setWorkspaces(prev => reorderTaskInWs(prev, wsId, projId, taskId, targetTaskId));
  };

  const handleSwitchWs = (id) => {
    setWsId(id);
    setSelectedProject(null);
    setDrawerTask(null);
    setDrawerWsId(null);
  };

  const views = ['dashboard', 'kanban', 'calendar', 'roadmap'];
  const viewLabels = { dashboard: 'Dashboard', kanban: 'Board', calendar: 'Calendar', roadmap: 'Roadmap' };

  const ViewComponent = { dashboard: DashboardView, kanban: KanbanView, calendar: CalendarView, roadmap: RoadmapView }[activeView] || DashboardView;

  return (
      <div style={{
        display: 'flex', height: '100vh',
        background: `radial-gradient(ellipse at 20% 10%, #0a0e14 0%, #000 60%)`,
        fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif",
        position: 'relative',
      }}>
        {/* Starfield */}
        <div style={{
          position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 0,
          backgroundImage: `
            radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.4), transparent 50%),
            radial-gradient(1px 1px at 28% 60%, rgba(255,255,255,0.25), transparent 50%),
            radial-gradient(1px 1px at 47% 22%, rgba(255,255,255,0.3), transparent 50%),
            radial-gradient(1px 1px at 73% 70%, rgba(255,255,255,0.35), transparent 50%),
            radial-gradient(1px 1px at 88% 33%, rgba(255,255,255,0.25), transparent 50%),
            radial-gradient(1px 1px at 35% 88%, rgba(255,255,255,0.2), transparent 50%),
            radial-gradient(1px 1px at 61% 45%, rgba(255,255,255,0.3), transparent 50%),
            radial-gradient(1px 1px at 91% 78%, rgba(255,255,255,0.2), transparent 50%)
          `,
        }} />
      <Sidebar
        workspace={workspace}
        workspaces={workspaces}
        onSwitchWorkspace={handleSwitchWs}
        selectedProject={selectedProject}
        onSelectProject={(id) => { setSelectedProject(id); setActiveView('kanban'); }}
        activeView={activeView}
        onSetView={setActiveView}
        theme={theme}
        overdueMap={overdueMap}
        onAddWorkspace={handleAddWorkspace}
        onRenameWorkspace={handleRenameWorkspace}
        onDeleteWorkspace={handleDeleteWorkspace}
        onResetData={handleResetData}
        onAddArea={handleAddArea}
        onRenameArea={handleRenameArea}
        onDeleteArea={handleDeleteArea}
        onEditProject={(proj) => setEditingProject(proj)}
        onArchiveProject={(projId, status) => handleUpdateProject(projId, { status })}
        onDeleteProject={handleDeleteProject}
        showArchived={showArchived}
        onToggleArchived={() => setShowArchived(prev => !prev)}
      />

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative', zIndex: 1 }}>
        {/* Top bar */}
        <div style={{
          height: 52, display: 'flex', alignItems: 'center',
          padding: '0 24px', borderBottom: `1px solid ${theme.border}`,
          background: theme.surface, gap: 8, flexShrink: 0,
          boxShadow: '0 1px 0 rgba(0,0,0,0.04)',
          position: 'relative',
        }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: theme.text, flex: 1 }}>
            {viewLabels[activeView]}
          </span>
          <button
            ref={searchBtnRef}
            onClick={() => setSearchOpen(prev => !prev)}
            title="Search tasks and projects"
            style={{
              background: 'none', border: 'none', color: searchOpen ? '#fff' : '#aab0b8',
              cursor: 'pointer', padding: 6, borderRadius: 6,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 15,
            }}
            onMouseEnter={function(e) { e.currentTarget.style.color = '#fff'; }}
            onMouseLeave={function(e) { e.currentTarget.style.color = searchOpen ? '#fff' : '#aab0b8'; }}
          >
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" strokeWidth="1.5"/>
              <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </button>
          <button onClick={handleExport} title="Export data as JSON" style={{
            width: 30, height: 30, borderRadius: 7, border: `1px solid ${theme.border}`,
            background: 'transparent', color: theme.mutedText, fontSize: 14,
            cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>↓</button>
          <button onClick={handleImport} title="Import data from JSON" style={{
            width: 30, height: 30, borderRadius: 7, border: `1px solid ${theme.border}`,
            background: 'transparent', color: theme.mutedText, fontSize: 14,
            cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>↑</button>
          <NavTabs activeView={activeView} onSetView={setActiveView} theme={theme} />
          {searchOpen && (
            <SearchPanel
              workspaces={workspaces}
              onClose={() => setSearchOpen(false)}
              onOpenTask={handleSearchOpenTask}
              onSwitchWorkspace={handleSwitchWs}
              searchBtnRef={searchBtnRef}
            />
          )}
        </div>

        <div style={{ flex: 1, overflow: 'hidden' }}>
          <ViewComponent
            workspace={visibleWorkspace}
            selectedProject={selectedProject}
            theme={theme}
            onOpenTask={handleOpenTask}
            onMoveTask={handleMoveTask}
            onAddTask={handleAddTask}
            onNewProject={() => setShowNewProject(true)}
            overdueMap={overdueMap}
            onReorderTask={handleReorderTask}
            onEditProject={handleUpdateProject}
            onDeleteProject={handleDeleteProject}
          />
        </div>
      </div>

      {/* Task Drawer */}
      {drawerTask && (
        <TaskDrawer
          task={drawerTask}
          project={drawerProject}
          area={drawerArea}
          theme={theme}
          onClose={() => { setDrawerTask(null); setDrawerWsId(null); }}
          onUpdate={handleUpdateTask}
          onDelete={handleDeleteTask}
        />
      )}

      {/* New Project Modal */}
      {showNewProject && (
        <ProjectModal
          theme={theme}
          areas={workspace.areas}
          onSave={handleAddProject}
          onClose={() => setShowNewProject(false)}
        />
      )}
      {editingProject && (
        <ProjectModal
          theme={theme}
          areas={workspace.areas}
          existingProj={editingProject}
          onSave={(updates) => handleUpdateProject(editingProject.id, updates)}
          onClose={() => setEditingProject(null)}
        />
      )}

      {toast && (
        <div style={{
          position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)',
          background: '#0d0f15', border: '1px solid rgba(0,229,212,0.35)',
          color: '#00e5d4', fontSize: 13, fontWeight: 500,
          padding: '10px 20px', borderRadius: 10, zIndex: 999,
          boxShadow: '0 4px 20px rgba(0,0,0,0.5)',
        }}>{toast}</div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
    <rect width="80" height="56" fill="#000"/>
    <rect x="0" y="0" width="16" height="56" fill="#0b0c10"/>
    <rect x="20" y="8" width="20" height="3" rx="1" fill="#ffffff" opacity="0.15"/>
    <rect x="20" y="15" width="14" height="2" rx="1" fill="#4a4d5e"/>
    <rect x="20" y="21" width="52" height="14" rx="3" fill="#0d0f15"/>
    <rect x="20" y="38" width="25" height="12" rx="3" fill="#0d0f15"/>
    <rect x="48" y="38" width="24" height="12" rx="3" fill="#0d0f15"/>
  </svg>
</template>
</body>
</html>
